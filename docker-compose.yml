services:
  db:
    image: postgres:latest
    container_name: taskdb
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - taskdata:/var/lib/postgresql

  api:
    build: .
    container_name: taskapi
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  taskdata: